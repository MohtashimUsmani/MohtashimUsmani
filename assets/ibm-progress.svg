<svg width="560" height="46" viewBox="0 0 560 46" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <clipPath id="barClip">
      <rect x="10" y="14" width="540" height="18" rx="9" ry="9"/>
    </clipPath>
  </defs>

  <!-- Label -->
  <text x="10" y="10" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#8b949e">
    IBM Data Science Professional Certificate
  </text>

  <!-- Track -->
  <rect x="10" y="14" width="540" height="18" rx="9" ry="9" fill="#21262d" stroke="#30363d" stroke-width="1"/>

  <!-- Animated fill -->
  <g clip-path="url(#barClip)">
    <rect x="10" y="14" height="18" fill="url(#fillGrad)" rx="9" ry="9">
      <animate attributeName="width" from="0" to="226.8" dur="1.6s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    </rect>
  </g>

  <!-- Percentage text, fades in after the fill animates -->
  <text x="280" y="26" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" opacity="0">
    5 / 12 Courses &#8226; 42%
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.4s" fill="freeze"/>
  </text>
</svg>
